<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- App-Symbol, vereinfacht für kleine Größen (bis 87 px): größere Form, dickerer Ring, kein Glanzlicht,
       hellere Schattenhälfte (auf schwarzem Homescreen sonst unsichtbar), größere Pupille. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22123A"/>
      <stop offset="1" stop-color="#0A0912"/>
    </linearGradient>
    <linearGradient id="ringLit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF6A9A"/>
      <stop offset="1" stop-color="#E8004F"/>
    </linearGradient>
    <clipPath id="left"><rect x="0" y="0" width="512" height="1024"/></clipPath>
    <clipPath id="right"><rect x="512" y="0" width="512" height="1024"/></clipPath>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <g clip-path="url(#left)">
    <circle cx="512" cy="512" r="330" fill="none" stroke="url(#ringLit)" stroke-width="96"/>
    <circle cx="512" cy="512" r="210" fill="#B0124F"/>
    <circle cx="512" cy="512" r="100" fill="#FFE3EC"/>
  </g>
  <g clip-path="url(#right)">
    <circle cx="512" cy="512" r="330" fill="none" stroke="#4A4459" stroke-width="96"/>
    <circle cx="512" cy="512" r="210" fill="#24202F"/>
  </g>
</svg>
