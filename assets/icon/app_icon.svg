<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- App-Symbol „Halbes Objektiv“ (Entwurf A, G3.1): links im Licht (Kamera an), rechts im Schatten (off camera). Quelle für alle Größen ab 114 px. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22123A"/>
      <stop offset="1" stop-color="#06060B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.36" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#FF2D6F" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#FF2D6F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ringLit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF6A9A"/>
      <stop offset="1" stop-color="#E0004F"/>
    </linearGradient>
    <radialGradient id="glassLit" cx="0.42" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#FF4F86"/>
      <stop offset="0.55" stop-color="#9E0E45"/>
      <stop offset="1" stop-color="#3A0A22"/>
    </radialGradient>
    <clipPath id="left"><rect x="0" y="0" width="512" height="1024"/></clipPath>
    <clipPath id="right"><rect x="512" y="0" width="512" height="1024"/></clipPath>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>
  <g clip-path="url(#left)">
    <circle cx="512" cy="512" r="300" fill="none" stroke="url(#ringLit)" stroke-width="60"/>
    <circle cx="512" cy="512" r="215" fill="url(#glassLit)"/>
    <circle cx="512" cy="512" r="78" fill="#FFE3EC"/>
    <ellipse cx="420" cy="400" rx="56" ry="34" fill="#FFFFFF" fill-opacity="0.55" transform="rotate(-35 420 400)"/>
  </g>
  <g clip-path="url(#right)">
    <circle cx="512" cy="512" r="300" fill="none" stroke="#2C2838" stroke-width="60"/>
    <circle cx="512" cy="512" r="215" fill="#121019"/>
    <circle cx="512" cy="512" r="78" fill="#1E1B27"/>
  </g>
</svg>
